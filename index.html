<script>
const DATA_ENDPOINT = "/.netlify/functions/devices";

function showDevices(elementId, devices, dotClass) {
  const container = document.getElementById(elementId);
  container.replaceChildren();

  if (!devices.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No devices listed";
    container.appendChild(empty);
    return;
  }

  devices.forEach(device => {
    const card = document.createElement("div");
    card.className = "device";

    const dot = document.createElement("span");
    dot.className = "device-dot " + dotClass;

    const name = document.createElement("span");
    name.textContent = device.studentName;

    card.appendChild(dot);
    card.appendChild(name);
    container.appendChild(card);
  });
}

function renderDevices(devices) {
  const broken = devices.filter(d => d.status === "BROKEN");
  const ready = devices.filter(d => d.status === "READY");
  const lost = devices.filter(d => d.status === "LOST");

  showDevices("brokenList", broken, "broken-dot");
  showDevices("readyList", ready, "ready-dot");
  showDevices("lostList", lost, "lost-dot");

  document.getElementById("brokenCount").textContent = broken.length;
  document.getElementById("readyCount").textContent = ready.length;
  document.getElementById("lostCount").textContent = lost.length;

  document.getElementById("loading").textContent = "";
}

async function loadDevices() {
  const loading = document.getElementById("loading");

  try {
    const response = await fetch(
      DATA_ENDPOINT + "?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const payload = await response.json();

    if (!payload.ok || !Array.isArray(payload.devices)) {
      throw new Error(payload.error || "Invalid data");
    }

    renderDevices(payload.devices);

  } catch (error) {
    loading.textContent =
      "Unable to load records. Please contact the IT Department.";

    console.error("Chromebook data error:", error);
  }
}

loadDevices();
setInterval(loadDevices, 60000);
</script>
